
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ollama Image - Paula Nogueira</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <link rel="stylesheet" href="sty.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="container">
        <section class="image-describer">
            <h1>Ollama Multi-modal Image Describer</h1>

            <label for="image">Upload up to 2 images:</label>
            <input id="image" type="file" accept="image/*" multiple>

            <div class="image-preview" id="preview">
                <span>No image selected</span>
            </div>

            <button id="send" type="button">Describe Images</button>

            <hr>

            <h2>Image Descriptions:</h2>
            <div id="result" class="descriptions" aria-live="polite">
                <p>Waiting for input...</p>
            </div>
        </section>
    </main>
</body>
</html>
